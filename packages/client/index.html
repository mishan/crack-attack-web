<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Crack Attack!</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d12;
        color: #d7dce5;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        font-variant-numeric: tabular-nums;
        font-size: 13px;
        line-height: 1.5;
        opacity: 0.85;
        pointer-events: none;
        white-space: pre;
      }
      #help {
        position: fixed;
        bottom: 12px;
        left: 12px;
        font-size: 12px;
        opacity: 0.6;
        pointer-events: none;
      }
      /* Shown until the bundle boots (main.ts removes it), so a slow first
         load reads as loading rather than a blank page. */
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4vmin;
        font-size: 15px;
        line-height: 28px;
        letter-spacing: 1px;
      }
      /* Laid out like attract mode's title card, which replaces it on boot. */
      #loading img {
        width: min(70vmin, 320px);
        height: auto;
      }
      #loading span {
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <img src="/textures/logo.png" alt="Crack Attack!" width="256" height="256" />
      <span>Loading…</span>
    </div>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="help">
      ←→↑↓ move &nbsp;·&nbsp; Z / Space swap &nbsp;·&nbsp; X raise &nbsp;·&nbsp; R restart
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
